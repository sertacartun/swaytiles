[project]
name = "sway-layout"
version = "0.1.0"
description = "Per-workspace tiling layouts for sway"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
sway-layout = "sway_layout:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["sway_layout.py"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["sway: needs a headless sway and a GTK 4 test client"]

[tool.ruff]
line-length = 160
extend-exclude = ["history"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["SIM115"]
