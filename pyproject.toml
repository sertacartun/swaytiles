[project]
name = "swaytiles"
version = "0.1.0"
description = "Per-workspace tiling layouts for sway"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/sertacartun/swaytiles"
Issues = "https://github.com/sertacartun/swaytiles/issues"

[project.scripts]
swaytiles = "swaytiles:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["swaytiles.py"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["sway: needs a headless sway and a GTK 4 test client"]

[tool.ruff]
line-length = 160

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["SIM115"]
